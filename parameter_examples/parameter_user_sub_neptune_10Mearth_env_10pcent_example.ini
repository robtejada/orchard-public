[general]
# Grid resolution (higher = slower, usually more accurate)
N = 500
# place more zones near the surface for better resolution
surf_width = 8e-2
surf_width2 = 6.5e-3
# End time of the simulation [Gyr]
final_age = 10.0
# Save interval [Myr]; 0 saves every accepted step
save_interval = 0
error = 5.0
# Maximum timestep [Myr]
max_step = 50
# Print detailed per-step diagnostics (errors, iterations, energy metrics)
verbose = True
save_verbose = True
# Optional HDF5 output (text outputs are still used by many utilities)
save_hdf5 = True
hdf5_filename = evolution.h5

[hydrostatic_equilibrium]
# Surface pressure [bar]
p_atm = 1.0
# If False, core/mantle entropy is set from [core] values instead of matching envelope
env_s_start = False
isothermal_compact_core = False

[boundary_condition]
planet = Sub_Neptune
# Atmosphere model: bare (airless), gray (thin rocky atm), ideal_gray
bc_atm = gray
# Equilibrium temperature [K] from host star irradiation
T_eq = 255
# Bond albedo of the planet
bond_albedo = 0.3

[equation_of_state]
# H-He EOS: cms, cd, scvh
hhe_eos = cd
# Envelope heavy-element EOS (default shown)
z_eos = aqua
water_eos = aqua
eos_tab = True

[initial]
# Planet mass in Earth masses (default setup uses M_planet = 1 Earth mass in grams from defaults)
M_Mearth = 10.0
# Initial entropy [k_B / baryon]
S_ini = 4.5
# Initial helium fraction Y / (X + Y)
Y_ini = 0.25
# Initial envelope heavy-element fraction Z (default 3.16 solar shown)
Z_ini = 0.5

outer_entropy_gradient = False
outer_entropy_use_mass = True
outer_entropy_inner_coord = 0.95
outer_entropy_outer_coord = 1.0
outer_entropy_delta = -0.005
outer_entropy_smooth_sigma = 1.5
outer_entropy_min = 0.0

[diffusion]

under_relax = 0.7

[transport]
radioactive = True
latent_heat_effect = True
tol_NR = 1e-10
latent_delta_t = 200.0
# Timescale (Myr) for relaxing χ toward its new target value, to avoid abrupt χ/Δχ jumps.
t_chi_relax = 1.0
# Apply χ-relaxation to mantle transport blending (viscous/inviscid handoff), not just latent terms.
chi_transport_relax = True
# Rebuild mantle transport blend from trial χ(T) inside the Newton residual (semi-implicit transition).
implicit_viscous_transition = True

eddy_overshoot = True
# Prefactor f_ov in kappa_ov.
eddy_overshoot_factor = 50.0
# Exponential scale length in units of H_P,int.
eddy_overshoot_fhp = 1.0
# Optional cap on Lambda_ov relative to local baseline Lambda (<=0 disables cap).
eddy_overshoot_lambda_cap = 50.0

[core]
# Core masses [Earth masses]-- coreless default
# Core composition / thermal state (advanced users may tune these)
mantle_entropy = 0.58
mass_core = 9.0
# Mass of iron core [Earth masses]
mass_core_fe = 2.997
fe_core_offset = 0.035
# Core/mantle material model choices
mantle_comp = mg2sio4
core_comp = Fe_pure
# Enable viscous mantle convection (recommended for rocky interiors)
mantle_convection = True
iron_core_convection = True
viscous_mantle_convection = True
mantle_thermal_conductivity = None
# Conductivity of the core. This is a constant value for now, but can be made T and rho dependent in the future.
core_thermal_conductivity = 40