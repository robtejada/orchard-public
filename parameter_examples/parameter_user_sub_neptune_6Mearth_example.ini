# Sub-Neptune (H/He envelope + rocky core)

[general]
# Number of mass zones (higher = more accurate but slower; typical: 300-700)
N = 500
# Surface mesh concentration (smaller = denser near surface)
surf_width = 1e-2
# Core mesh concentration (smaller = denser near core)
surf_width2 = 6.5e-3
# End time of the simulation [Gyr]
final_age = 10.0
# Maximum allowed timestep [Myr]
max_step = 50
# Save interval [Myr] (0 = save every accepted step)
save_interval = 0
# Save in HDF5 format (True) or text (False)
save_hdf5 = True
# HDF5 output filename
hdf5_filename = evolution.h5
verbose = True
save_verbose = True

[hydrostatic_equilibrium]
# Must be False for sub-Neptunes (use mantle_entropy from [core])
env_s_start = False

[boundary_condition]
# Planet label: Sub_Neptune
planet = Sub_Neptune
# Atmosphere model: f07 (Fortney+ 2007, irradiated sub-Neptune)
bc_atm = f07
# Equilibrium temperature [K] from host star irradiation
T_eq = 800
# Bond albedo of the planet
bond_albedo = 0.5

[equation_of_state]
# H-He EOS: cd (Chabrier & Debras 2021), cms (Chabrier+ 2019)
hhe_eos = cd
# Heavy-element EOS: aqua (water), ice_mixture (CH4+NH3+H2O)
z_eos = aqua

[initial]
# Total planet mass [Earth masses]
M_Mearth = 6.0
# Initial envelope entropy [k_B/baryon] (typical: 3-6 for sub-Neptunes)
S_ini = 4.0
# Initial helium fraction Y/(X+Y)
Y_ini = 0.25
# Envelope heavy-element mass fraction
Z_ini = 0.65

[transport]
# Include radiative transport in the envelope
radiation = True
# Include radiogenic heating (K-40, Th-232, U-235, U-238) in mantle
radioactive = True
# Include latent heat from mantle melt/freeze transitions
latent_heat_effect = True
# Enhanced heat transport across envelope-mantle boundary
eddy_overshoot = True
# Overshoot prefactor (larger = more envelope-mantle coupling)
eddy_overshoot_factor = 5.0
# Cap on overshoot conductivity relative to local baseline
eddy_overshoot_lambda_cap = 5.0

[diffusion]
# Allow envelope composition (Y, Z) to evolve
composition_change = True
# Enable metal (water/rock) rain in the envelope
metal_rain = False
# Stability criterion: 0.0 = Schwarzschild, 1.0 = Ledoux
R_rho = 1.0

[core]
# Mantle + core mass [Earth masses]
mass_core = 5.4
# Iron core mass [Earth masses]
mass_core_fe = 1.7982
# Initial mantle entropy [k_B/baryon]
mantle_entropy = 0.67
# Entropy offset between mantle and iron core [k_B/baryon]
fe_core_offset = 0.015
# Mantle composition: mg2sio4 (default), mgsio3, h2o
mantle_comp = mgsio3
# Enable viscous mantle convection (recommended for rocky interiors)
mantle_convection = True
iron_core_convection = True
viscous_mantle_convection = True
# Mantle conductivity [W/m/K] (None = use Stamenkovic+ 2011 model)
mantle_thermal_conductivity = None
# Iron core conductivity [W/m/K]
core_thermal_conductivity = 100.0
