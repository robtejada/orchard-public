# Neptune with inhomogeneous composition

[general]
# Number of mass zones (higher = more accurate but slower; typical: 300-700)
N = 300
# End time of the simulation [Gyr]
final_age = 5.0
# Maximum allowed timestep [Myr]
max_step = 50
# Save interval [Myr] (0 = save every accepted step)
save_interval = 50
# Save in HDF5 format (True) or text (False)
save_hdf5 = True
# HDF5 output filename
hdf5_filename = evolution.h5
early_max_step_myr = 1.0
early_max_step_until_gyr = 1.0
early_save_interval_myr = 1.0
early_save_until_gyr = 1.0
verbose = True
save_verbose = True

[boundary_condition]
# Planet label: Jupiter, Saturn, Super_Jupiter, Exoplanet
planet = Neptune
# Atmosphere model: c23 (Jupiter/Saturn), c26 (isolated gas giants), f11 (general)
bc_atm = g75
# Include atmospheric irradiation (c23 only; c26 is always isolated)
irradiation = True
# Include ammonia clouds (c23 only)
cloud = True
# Fix helium in atmosphere tables (False = interpolate across Y)
y_atm_fixed = True
# Fix metallicity in atmosphere tables (c26 supports Z interpolation)
z_atm_fixed = True
# Atmospheric helium fraction if y_atm_fixed = True
Y_atm = 0.25
# Atmospheric metallicity [solar units] if z_atm_fixed = True
Z_atm = 10.0
t_eq = 40

[equation_of_state]
# H-He EOS: cd (Chabrier & Debras 2021), cms (Chabrier+ 2019), scvh (legacy)
hhe_eos = cd
# Heavy-element EOS: aqua (water), ice_mixture (CH4+NH3+H2O)
z_eos = ice_mixture
rock_mixtures = True

[initial]
# Planet mass [Earth masses] (317.907 = 1 M_J, 95.159 = 1 M_S)
M_Mearth = 17.147
# Planet mass [Jupiter masses] (used when M_MJup > 1.0)
M_MJup = 1.0
# Initial entropy [k_B/baryon] (typical: 8-11 for hot-start Jupiters)
S_ini = 6.5
# Protosolar helium fraction Y/(X+Y) (0.277 = Bahcall+ 2006)
Y_ini = 0.277
# Envelope heavy-element mass fraction (0.0518 ~ 3.16 solar)
Z_ini = 0.25
# Build initial structure via RK4 shooting (True) or isentrope interpolation (False)
rk4_initial = False
# If True, use total M_z [Earth masses] instead of Z_ini for total metals
mz_struct = False
# Total heavy-element mass [Earth masses] (used if mz_struct = True)
M_z = 20
z_init_coords = [0, 0.2, 0.3, 0.32, 0.6, 0.62, 0.88, 0.96, 0.98, 1.0]
s_init_coords = [0, 0.2, 0.3, 0.32, 0.6, 0.62, 0.88, 0.96, 0.98, 1.0]
f_rock_init_coords = [0, 0.2, 0.3, 0.32, 0.6, 0.62, 0.88, 0.96, 0.98, 1.0]
z_init_deltas = [0, 0, -0.1, 0, -0.05, 0, -0.05, -0.53, 0]
f_rock_init_deltas = [0, 0, 0, 0, 0, 0, 0, -0.05, 0]
s_init_deltas = [0, 0, 0.5, 0, 0.25, 0, 0.1, 2.85, 0]
struct_smooth = True
struct_sigma = 2.0

[hydrostatic_equilibrium]
# Include rigid-body rotation
rotation = False
# Rotation period [seconds] (Jupiter: 35730, Saturn: 38014)
period = 57996
c_moi = 0.224
p_atm_gpa = 1e-4

[diffusion]
# Enable helium rain (H-He phase separation)
helium_rain = False
# Miscibility curve: l (Lorenzen), s (Schoettler), s_mod (modified Schoettler)
misc_curve = l
# Temperature offset for miscibility curve [K] (shifts rain onset)
misc_deltaT = 0
# Pressure scale height for helium rain advection [cm]
Hr_y = 1e9
# Rain advection model: legacy or bottom_up (Helled+ 2025)
rain_model = legacy
t_db_relax = 2
# Stability criterion blend: 0.0 = Schwarzschild, 1.0 = Ledoux
R_rho = 1.0
# Microscopic helium diffusion coefficient [cm^2/s]
Dmicro_y = 1e-3
# Microscopic metal diffusion coefficient [cm^2/s]
Dmicro_z = 1e-4

[transport]
# Disable the early-time radiative ramp: the stably-stratified inhomogeneous
# envelope needs full-strength radiative transport once surface convection
# shuts off (see rad_ramp_gyr in parameters_default.ini).
rad_ramp_gyr = 0.0
# Use local pressure scale height for mixing length (recommended)
use_local_Hp = True
# Include radiative transport in the envelope
radiation = True
# Enable semiconvective flux in Ledoux-stable, Schwarzschild-unstable zones
semiconvection = False
radioactive = True
ledoux = True
dmicro_z_in = 1e-4

[core]
mass_core = 3.25
mass_core_fe = 0.1
mantle_comp = mgsio3
core_comp = Fe_alloy
eos_core = I14
