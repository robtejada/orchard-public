# Super-Earth (bare, no atmosphere)

[general]
# Number of mass zones (higher = more accurate but slower; typical: 300-700)
N = 500
# Surface mesh concentration (smaller = denser near surface)
surf_width = 8e-2
# End time of the simulation [Gyr]
final_age = 10.0
# Adaptive timestep error tolerance
error = 5.0
# Maximum allowed timestep [Myr]
max_step = 50
# Save interval [Myr] (0 = save every accepted step)
save_interval = 0
# Save in HDF5 format (True) or text (False)
save_hdf5 = True
# HDF5 output filename
hdf5_filename = evolution.h5
verbose = True
save_verbose = True

[hydrostatic_equilibrium]
# Must be False for super-Earths (use mantle_entropy from [core])
env_s_start = False

[boundary_condition]
# Planet label: Super_Earth
planet = Super_Earth
# Atmosphere model: bare (airless), gray (thin rocky atm), ideal_gray
bc_atm = bare
# Equilibrium temperature [K] from host star irradiation
T_eq = 255

[initial]
# Total planet mass [Earth masses] (must equal mass_core for bare super-Earths)
M_Mearth = 10.0
# Initial entropy [k_B/baryon] (typical: 5-8 for rocky planets)
S_ini = 7.5
# Helium fraction Y/(X+Y)
Y_ini = 0.25
# Heavy-element fraction (very small for bare super-Earths)
Z_ini = 0.00017
# Apply outer entropy ramp to avoid hot-surface initialization issues
outer_entropy_gradient = True
# Entropy offset at surface (negative = cooler surface)
outer_entropy_delta = -0.005

[transport]
# Include radiogenic heating (K-40, Th-232, U-235, U-238) in mantle
radioactive = True
# Include latent heat from mantle melt/freeze transitions
latent_heat_effect = True
# Width of melt transition window [K]
latent_delta_t = 200.0
# Enhanced heat transport at outer boundary
eddy_overshoot = False
# Overshoot prefactor (larger = more heat escapes)
eddy_overshoot_factor = 25.0
# Cap on overshoot conductivity relative to local baseline
eddy_overshoot_lambda_cap = 25.0

[core]
# Mantle + core mass [Earth masses] (= M_Mearth for bare super-Earths)
mass_core = 10.0
# Iron core mass [Earth masses]
mass_core_fe = 3.33
# Initial mantle entropy [k_B/baryon]
mantle_entropy = 0.58
# Entropy offset between mantle and iron core [k_B/baryon]
fe_core_offset = 0.035
# Mantle composition: mg2sio4 (default), mgsio3, h2o
mantle_comp = mg2sio4
# Enable viscous mantle convection (recommended for rocky interiors)
mantle_convection = True
iron_core_convection = True
viscous_mantle_convection = True
# Mantle conductivity [W/m/K] (None = use Stamenkovic+ 2011 model)
mantle_thermal_conductivity = None
# Iron core conductivity [W/m/K]
core_thermal_conductivity = 100

[diffusion]
under_relax = 0.7
