name: ORCHARD docs bot — issue responder

# Posts an AI first-pass answer (grounded in the public docs) on each newly
# opened issue, and points users to the docs / a maintainer.
#
# Requires the repository secret ANTHROPIC_API_KEY. Commenting uses the default
# GITHUB_TOKEN. The `issues` event does not fire for pull requests.
#
# To gate on a label instead of every issue, change the trigger to
#   issues: { types: [labeled] }
# and add `if: github.event.label.name == 'question'` to the job.

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs_bot/requirements.txt

      - name: Install docs-bot dependencies
        run: pip install -r docs_bot/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('docs_bot/config.py') }}

      - name: Build corpus + index (public, git-tracked only)
        run: |
          python docs_bot/build_corpus.py
          python docs_bot/build_index.py

      - name: Generate first-pass answer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python docs_bot/answer_issue.py

      - name: Post comment (only if an answer was produced)
        if: ${{ hashFiles('bot_comment.md') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file bot_comment.md
